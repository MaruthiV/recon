<svg xmlns='http://www.w3.org/2000/svg' width='930' height='240' viewBox='0 0 930 240' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='930' height='240' rx='12' fill='#fbfbf9' stroke='#e6e6e1'/>
<text x='24' y='36' font-size='17' font-weight='600' fill='#1f2328'>Validation split, 70 cases, three passes each</text>
<rect x='24' y='54' width='12' height='12' rx='3' fill='#2f855a'/>
<text x='42' y='64' font-size='13' fill='#6b6f76'>right every pass</text>
<rect x='166' y='54' width='12' height='12' rx='3' fill='#9fd0ae'/>
<text x='184' y='64' font-size='13' fill='#6b6f76'>right in some passes</text>
<rect x='336' y='54' width='12' height='12' rx='3' fill='#c27c0e'/>
<text x='354' y='64' font-size='13' fill='#6b6f76'>missed, left open</text>
<rect x='485' y='54' width='12' height='12' rx='3' fill='#c53030'/>
<text x='503' y='64' font-size='13' fill='#6b6f76'>closed wrongly at least once</text>
<text x='24' y='111' font-size='14' fill='#1f2328'>rules</text>
<rect x='190.0' y='92' width='456.0' height='26' fill='#2f855a'/>
<rect x='646.0' y='92' width='24.0' height='26' fill='#c27c0e'/>
<rect x='670.0' y='92' width='80.0' height='26' fill='#c53030'/>
<text x='762' y='111' font-size='13.5' fill='#1f2328'><tspan font-weight='600'>57/70</tspan></text>
<text x='24' y='157' font-size='14' fill='#1f2328'>multi-agent</text>
<rect x='190.0' y='138' width='384.0' height='26' fill='#2f855a'/>
<rect x='574.0' y='138' width='48.0' height='26' fill='#9fd0ae'/>
<rect x='622.0' y='138' width='48.0' height='26' fill='#c27c0e'/>
<rect x='670.0' y='138' width='80.0' height='26' fill='#c53030'/>
<text x='762' y='157' font-size='13.5' fill='#1f2328'><tspan font-weight='600'>48/70</tspan><tspan fill='#6b6f76'>  (50 to 53 a pass)</tspan></text>
<text x='24' y='203' font-size='14' fill='#1f2328'>single agent</text>
<rect x='190.0' y='184' width='264.0' height='26' fill='#2f855a'/>
<rect x='454.0' y='184' width='184.0' height='26' fill='#9fd0ae'/>
<rect x='638.0' y='184' width='64.0' height='26' fill='#c27c0e'/>
<rect x='702.0' y='184' width='48.0' height='26' fill='#c53030'/>
<text x='762' y='203' font-size='13.5' fill='#1f2328'><tspan font-weight='600'>33/70</tspan><tspan fill='#6b6f76'>  (45 to 46 a pass)</tspan></text>
</svg>
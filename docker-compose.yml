services:
  db:
    image: pgvector/pgvector:0.8.5-pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - recon-pg:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  recon-pg:

[project]
name = "recon"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk[mcp]==2.11.0",
    "google-genai==2.28.0",
    "mcp==2.3.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pgvector==0.5.0",
    "httpx==0.28.1",
]

[project.scripts]
recon = "recon_cli.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.3",
    "ruff==0.16.10",
    "pyright==1.1.414",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/domain/recon_domain",
    "packages/storage/recon_storage",
    "packages/provider/recon_provider",
    "packages/retrieval/recon_retrieval",
    "apps/provider_sim/provider_sim",
    "apps/worker/recon_worker",
    "apps/mcp/recon_mcp",
    "apps/api/recon_api",
    "apps/cli/recon_cli",
    "agents/recon_agents",
    "evals/verifier/recon_verifier",
    "evals/fixtures/recon_fixtures",
    "evals/bench/recon_bench",
]

[tool.uv]
# releases must be >= 2 weeks old, bump at gate boundaries
exclude-newer = "2026-10-03T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: calls a real model, needs RECON_LIVE=1 and a spend go",
    "local: calls a local ollama model, needs RECON_LOCAL=1",
]
addopts = "-p no:cacheprovider"
# adk's own noise, not ours
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore:MCPTool class is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# formatter owns line length
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
    "recon_domain",
    "recon_storage",
    "recon_provider",
    "recon_retrieval",
    "provider_sim",
    "recon_worker",
    "recon_mcp",
    "recon_agents",
    "recon_api",
    "recon_cli",
    "recon_verifier",
    "recon_fixtures",
    "recon_bench",
]

[tool.pyright]
include = ["packages", "apps", "agents", "evals", "tests"]
exclude = ["scratch", "**/migrations/versions"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

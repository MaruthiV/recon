[project]
name = "recon"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "google-adk[mcp]==2.11.0",
    "google-genai==2.28.0",
    "mcp==2.3.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pgvector==0.5.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.3",
    "ruff==0.16.10",
    "pyright==1.1.414",
]

[tool.uv]
package = false
# releases must be >= 2 weeks old, bump at gate boundaries
exclude-newer = "2026-10-03T00:00:00Z"
